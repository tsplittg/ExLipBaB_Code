[tool.poetry]
name = "exlipbab"
version = "0.1.0"
description = "An exact computation method for the Lipschitz constant of piecewise linear neural networks"
authors = ["Submission 6397"]
license = "None"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11, <3.15"
pycddlib = ">=3.0.2"
numpy = "^2.4.1"
pandas = "^2.3.3"
cvxopt = "^1.3.2"
mosek = "^11.1.3"
tqdm = "^4.67.1"
matplotlib = "^3.10.8"
torch = "^2.9.1"
ucimlrepo = "^0.0.7"
pypoman = "^1.2.0"
polytope = "^0.2.5"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
